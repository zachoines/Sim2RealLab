strafer_subgoal_generator:
  ros__parameters:
    # Fallback plan input; the primary path comes from this node's own
    # ComputePathToPose requests. /plan is Nav2's stock default (not
    # remapped here) — override if the planner is namespaced.
    plan_topic: "/plan"

    # Replan ownership: while the inference node's active-goal telemetry
    # is fresh, request ComputePathToPose on this cadence. Must stay below
    # path_timeout_s (the plan-staleness suppression window) or the plan
    # goes stale between replans.
    replan_period_s: 0.5
    active_goal_topic: "/strafer_inference/active_goal"
    # Telemetry keep-alive is ~1 Hz from the inference node; 2.5 s
    # tolerates one missed message plus publish jitter before
    # replanning stops.
    goal_telemetry_timeout_s: 2.5
    planner_action: "/compute_path_to_pose"
    planner_id: "GridBased"

    # Anchoring semantics — the train/deploy contract this node exists to
    # reproduce. Training installs ONE path per goal and only ever advances a
    # monotonic cursor along it, so the robot can genuinely BE off its path and
    # the policy sees a real cross-track error to correct.
    #
    #   mission  (shipped default): the first plan of a mission is anchored;
    #            later plans are planner LIVENESS and are discarded unless they
    #            pass an admission rule below.
    #   rolling  (legacy fallback): every accepted plan re-roots the path under
    #            the robot. Kept named so the rig re-validation can A/B the two
    #            semantics without editing code. Measured under `rolling`:
    #            cross-track stays ~0.03 m (one costmap cell) over 5.95 m of
    #            travel, i.e. no corrective lateral signal can accumulate.
    subgoal_anchoring: "mission"

    # Admission rule (ii): the robot is farther off the anchored path than this,
    # so the corridor is genuinely lost and a subgoal on it would steer the
    # policy at a route it can no longer reach. 0.5 m sits just under the global
    # costmap's 0.55 m inflation_radius (strafer_navigation/config/nav2_params.yaml)
    # and ~15x the cross-track seen under `rolling`, so ordinary tracking error
    # cannot trip it.
    admission_cross_track_m: 0.5

    # Admission rule (i): the anchored path's REMAINING portion now crosses
    # costmap cells at or above the inscribed threshold. Only the part ahead of
    # the cursor is checked — an obstacle appearing behind the robot is not a
    # reason to re-plan. The check abstains (never admits) with no costmap, a
    # stale one, or a frame mismatch, so a missing costmap degrades to the
    # cross-track and goal-change rules rather than to re-rooting.
    admission_collision_check: true
    costmap_topic: "/global_costmap/costmap"
    # OccupancyGrid units after nav2_costmap_2d's translation table:
    # 100 = LETHAL (254), 99 = INSCRIBED_INFLATED (253), -1 = NO_INFORMATION.
    costmap_lethal_cost: 99
    costmap_timeout_s: 5.0

    # Periodic one-line anchoring summary (admitted / held / by-reason counts,
    # cursor, cross-track) so the semantics are legible from a normal mission
    # log without arming a parity capture. 0 disables.
    anchor_log_period_s: 10.0

    # Guards for a robot parked inside the costmap inflation halo, where the
    # planner refuses the robot's own pose as a start and the resulting subgoal
    # suppression is what keeps it there. Both are degraded modes and both log.

    # Planner able to start from an inflated cell, registered in
    # strafer_navigation's nav2_params.yaml. Requested only while the primary
    # is refusing; empty disables. The only guard that also covers a new
    # mission, where no valid held plan exists to fall back on.
    fallback_planner_id: "GridBasedRelaxed"
    planner_refusals_before_fallback: 2
    # Above the halo width, so the primary is not re-trusted while the robot
    # still sits in the pose it refuses.
    fallback_release_m: 0.25

    # Republish the last valid subgoal (only while it still serves the active
    # goal) so the policy can drive clear. Converted to ticks, hence a
    # POLICY-time budget: a wall-clock one buys proportionally less robot
    # motion as RTF falls. One window per episode — on expiry the subgoal is
    # suppressed and the watchdog trips, so an unrecoverable wedge fails loud.
    # 0 disables the hold.
    starvation_hold_s: 5.0
    starvation_stationary_m: 0.05
    starvation_stationary_s: 1.0

    # Dedicated rolling-subgoal channel. The mission goal is not a topic —
    # it arrives via navigate_to_pose, and a new goal there resets the
    # policy's hidden state, so the streamed subgoal stays separate.
    subgoal_topic: "/strafer/subgoal"

    map_frame: "map"
    base_frame: "base_link"

    # update_period_s and lookahead_m are omitted on purpose: the node
    # defaults them from strafer_shared.constants (POLICY_SIM_DT *
    # POLICY_DECIMATION, SUBGOAL_LOOKAHEAD_M) so the policy rate and
    # train/deploy parity can't drift via a config literal. Set here only
    # for a deliberate operator override.

    # 0 means "use the path as published"; >= 2 head-first truncates.
    max_path_points: 0

    # Stop publishing the subgoal once /plan ages past this, so a wedged
    # global planner reaches the inference node's subgoal watchdog rather
    # than the policy chasing a stale path. Generator half of a split
    # budget (~1.0 s here + ~1.0 s in the watchdog before /cmd_vel zeros).
    path_timeout_s: 1.0
