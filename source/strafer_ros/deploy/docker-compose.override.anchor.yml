# Mounts a generated subgoal_generator.yaml over the copy installed in the image,
# so changing the anchoring is a container recreate rather than an image rebuild.
#
# Not for hand use: deploy/tools/configure_inference.sh generates that config
# from the image and verifies the result, both of which applying this overlay
# directly skips.
services:
  inference:
    volumes:
      - type: bind
        source: ${STRAFER_ANCHOR_CONFIG:?run deploy/tools/configure_inference.sh instead of applying this overlay by hand}
        target: /ws/install/strafer_inference/share/strafer_inference/config/subgoal_generator.yaml
        read_only: true
