# LOCAL, UNTRACKED — host-specific VLM/planner URLs for the semantic-goal test.
# NOT committed: env_autonomy.env keeps VLM_URL/PLANNER_URL empty by design
# (they're per-host). This wires the deploy `autonomy` service to this session's
# sim-host serve-vlm (:8100) / serve-planner (:8200) for `make submit-deploy`.
services:
  # --- v2 policy validation (2026-07-28) ---------------------------------------
  # docker-compose.override.sim-bridge.yml pins STRAFER_INFERENCE_MODEL_PATH to
  # /models/policy.onnx (= v1). This file is applied AFTER it in the -f chain, so
  # the value below wins. The canonical env_autonomy.env is NOT the lever for this
  # lane -- a service `environment:` key beats `env_file:`, so an env-sync'd canon
  # edit would be silently inert here (verified with `docker compose config`).
  # ROLLBACK TO v1: comment out the model-path line below, then
  #   docker compose ... up -d --force-recreate inference
  # NOT `restart` -- restart reuses the OLD container environment and will silently
  # keep the previous model loaded (observed 2026-07-28). Warm either way (~2.5 s):
  # v1's TRT engine stays cached (keyed on graph hash, not filename) and
  # policy.onnx is untouched.
  inference:
    environment:
      # v2 ACTIVE.
      STRAFER_INFERENCE_MODEL_PATH: /models/strafer_depth_subgoal_v2_998.onnx
      STRAFER_USE_SIM_TIME: "true"

  # --- fresh map for the ENRICHED scene (2026-07-28) ----------------------------
  # rtabmap persists /root/.ros/rtabmap.db in the strafer_ros_home volume and
  # RELOADS it on start (observed: "Using database from /root/.ros/rtabmap.db
  # (106 MB)", WM=220 from 219 prior nodes, plus a dictionary-repair warning).
  # That map was built 2026-07-23 on ProcRoom-v0 -- the NON-enriched scene. The
  # enriched scene adds enclosed rooms, tall furniture and mid-room columns, so
  # the stale grid mismatches reality, and Nav2's /plan (the reference the
  # corner-cutting observation is measured against) would be meaningless.
  # Pointing at a NEW db gives a clean map WITHOUT deleting the old one -- the
  # cheatsheet's `docker volume rm strafer_strafer_ros_home` is destructive and
  # unnecessary. Reversal: drop this `command:` override.
  # NOTE: recreate `sim-perception` alongside slam -- donut_warmup is one-shot at
  # its startup and must re-run to seed the fresh map.
  # 2026-07-28 later session: the DGX sim was RESTARTED (/clock reset 713 s -> 84 s).
  # The task is Proc(edural)Room, so a restarted run is not guaranteed to regenerate
  # the same layout -- reusing the previous run's db would risk re-creating exactly
  # the wrong-scene-map problem this override exists to avoid. Fresh db per sim run.
  slam:
    # NOTE: bump this filename on EVERY sim restart. Observed 3 distinct sim runs in
    # ~12 h (/clock reset 713 -> 84 -> 39 s), each a fresh procedural layout. This
    # manual bump is the workaround; RC-4's real fix is keying the db to the scene id.
    command: ros2 launch strafer_slam slam.launch.py use_sim_time:=true database_path:=/root/.ros/rtabmap_run3.db

  autonomy:
    environment:
      VLM_URL: http://192.168.50.196:8100
      PLANNER_URL: http://192.168.50.196:8200
      STRAFER_USE_SIM_TIME: "true"
      STRAFER_NAV_BACKEND: hybrid_nav2_strafer   # dispatch semantic goals to the POLICY (/strafer_inference/navigate_to_pose), in lockstep with the inference service
