# The inference node is launched namespaced (name AND namespace =
# strafer_inference, FQN /strafer_inference/strafer_inference). A bare
# "strafer_inference:" key matches only a node in the global namespace, so
# every value below would silently fail to bind. "/**" matches any
# fully-qualified name and survives a future namespace change.
/**:
  ros__parameters:
    # model_path and policy_variant are supplied per launch by
    # inference.launch.py's override (env STRAFER_INFERENCE_MODEL_PATH /
    # STRAFER_POLICY_VARIANT), applied last so it wins over this file; a bare
    # `ros2 run` passes them with -p. Omitted here so there is one owner and no
    # dead duplicate that could re-bind an empty model_path or wrong variant.

    # infer_period_s is omitted on purpose: the node derives the tick period
    # from strafer_shared.constants (POLICY_SIM_DT * POLICY_DECIMATION), so the
    # deploy rate can't drift from training via a config literal — same reason
    # subgoal_generator.yaml omits update_period_s.

    # Node-level contract name; inference.launch.py remaps it to the
    # shared /cmd_vel that the RoboClaw driver and the sim bridge
    # actually consume (same remap driver.launch.py applies).
    cmd_vel_topic: "/strafer/cmd_vel"
    # Status telemetry (accepted goal at accept + ~1 Hz keep-alive while a
    # mission executes) consumed by the subgoal generator's replan
    # ownership. NOT a command channel: navigate_to_pose is the only way
    # to command a mission.
    active_goal_topic: "/strafer_inference/active_goal"
    active_goal_keepalive_period_s: 1.0
    depth_topic: "/d555/depth/image_rect_raw"
    # Rolling subgoal pose (subgoal variants only); published by the
    # strafer_subgoal_generator node. Subscribed only when the loaded
    # variant declares subgoal_* fields.
    subgoal_topic: "/strafer/subgoal"
    imu_topic: "/d555/imu/filtered"
    joint_states_topic: "/strafer/joint_states"
    odom_topic: "/strafer/odom"
    map_frame: "map"
    base_frame: "base_link"

    tf_max_age_s: 0.5
    obs_timeout_s: 0.2
    depth_timeout_s: 0.5
    # Rolling-subgoal freshness (subgoal variants only). The inference half of
    # a split stale-plan budget: the generator stops publishing the subgoal
    # ~1.0 s after its plan source dies (planner down / replanning stopped),
    # then this window trips ~1.0 s later, so the two compose to ~2.0 s before
    # /cmd_vel zero-twists. Longer than obs/depth because the generator
    # replans on a ~0.5 s cadence, not every tick.
    path_timeout_s: 1.0

    # vel_cap_* default to the indoor-safety Nav2 cap (a NAV_VEL_SCALE
    # fraction of the chassis maximum) that strafer_navigation uses on
    # every lane. Set an explicit cap here only for an intentional
    # per-node override.

    # goal_reached_distance_m defaults to strafer_shared GOAL_ARRIVAL_RADIUS_M
    # (train/deploy parity); uncomment to override with an intentional value.
    mission_timeout_s: 60.0

    # ONNX Runtime provider preference, priority order. ORT binds the first
    # provider whose libs load and drops to the next; the node logs the bound
    # set at startup. Per-variant (measured, Orin Nano): DEPTH/DEPTH_SUBGOAL
    # need a GPU EP (TRT ~4.7 ms, CPU ~84 ms — over the 33 ms budget);
    # NOCAM/NOCAM_SUBGOAL are fastest on CPU (~0.056 ms; GPU launch overhead
    # dominates the tiny MLP) — set onnx_providers=[CPUExecutionProvider].
    onnx_providers:
      - "TensorrtExecutionProvider"
      - "CUDAExecutionProvider"
      - "CPUExecutionProvider"

    # ONNX intra-op threads. 1 fits the small MLP policies (~50 us/inf);
    # ORT's default (all cores, spin-waiting) starves the rest of the
    # stack. Raise only for a conv-heavy variant (e.g. DEPTH). Governs only
    # the CPU intra-op pool — it does not throttle the TRT/CUDA EP, whose
    # kernels run on the GPU with their own host-side threads.
    onnx_intra_op_threads: 1

    # TensorRT engine cache. The TRT EP builds the engine on first inference;
    # for DEPTH_SUBGOAL that is a ~90 s cold start on Orin Nano. Persisting it
    # to a stable, writable path lets relaunches deserialize the engine
    # instead of rebuilding. The node expanduser's ~ and creates the dir.
    # enable=false or an empty path keeps the plain provider list (rebuild
    # every launch). The cache is invalidated automatically on a model / ORT /
    # TensorRT version change, so it is safe to leave enabled.
    trt_engine_cache_enable: true
    trt_engine_cache_path: "~/.cache/strafer_inference/trt_engines"

    # --- tick scheduling + cadence instrumentation ----------------------------
    # Drive the tick from depth ARRIVAL as well as from the timer. The
    # depth-freshness gate is the rate limiter either way (still one inference
    # per fresh frame); this only aligns the tick's PHASE with the frame it
    # needs. Measured on the 2026-07-31 parity capture with timer-only
    # scheduling: 23.49 Hz sim against a 30 Hz training cadence, with 100% of
    # the missing ticks landing on sim slots where a depth frame WAS published.
    # At RTF 0.15 one sim step spans ~218 ms of wall and that step's depth
    # frame lands deep inside it (25.8% within 1 ms of the clock step, 59.0% at
    # >=90 ms), so a timer-driven tick usually fires BEFORE the frame it needs,
    # the gate correctly skips, and the frame is superseded before any later
    # tick reads it. Set false to restore timer-only scheduling for an A/B.
    tick_on_depth: true

    # Depth subscription reliability: "best_effort" (default) or "reliable".
    # BEST_EFFORT/depth=1 was chosen when a dropped frame cost a tick the gate
    # would have skipped anyway; with the tick driven by arrival, a frame lost
    # in transport is a lost policy step. Keep the default: a RELIABLE
    # subscriber is QoS-INCOMPATIBLE with a BEST_EFFORT publisher and would
    # receive nothing at all if the camera is brought up with
    # depth_qos:=SENSOR_DATA. Flip it only for a measured A/B against a known
    # RELIABLE publisher (the sim bridge is one) — see depth_rx in the cadence
    # log for whether it is worth flipping.
    depth_reliability: "best_effort"

    # Executor threads. Five callback groups can block: the tick's default
    # group, the depth group (the 921 KB deserialize), the action server's
    # reentrant group, rclpy's implicit node group (/clock under use_sim_time
    # + the parameter services) and tf2_ros's private /tf group. Three threads
    # for five groups lets /clock queue behind the depth take, and rcl drops a
    # missed ROS_TIME deadline rather than catching up. That is a real but
    # SMALL residual (at most 2.9% of sim slots on the 2026-07-31 capture, not
    # the cadence shortfall itself); timer_deadline_missed measures it.
    executor_threads: 5

    # Periodic one-line cadence + skip-by-cause summary, so a cadence
    # regression is visible from an ordinary mission log without arming a
    # parity capture. depth_rx vs inferences is the load-bearing pair: both
    # short indicts the depth transport (the subscription is
    # BEST_EFFORT/depth=1), inferences alone indicts the node. 0 disables.
    cadence_log_period_s: 10.0
